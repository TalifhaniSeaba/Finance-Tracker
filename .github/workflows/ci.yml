name: Continuous Integration

on:
    push:
        branches: [main, develop]
    
    pull_request:
        branches: [main, develop]
            

jobs:
    frontend-tests:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
            - name: Enable pnpm
              run: corepack enable

            - name: Install Dependencies
              run: pnpm install
            - name: Run Lint
              run: pnpm lint
            - name: Run tests
              run: pnpm test

    backend-tests:
     runs-on: ubuntu-latest

     defaults:
        run:
            working-directory: backend

     steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test     
                  
                


              